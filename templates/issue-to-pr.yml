name: Agent issue to pull request

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  run-agent:
    name: Run agent workflow
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent-pr' &&
       github.event.sender.login == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.sender.login == github.repository_owner &&
       (github.event.comment.body == '/agent' ||
        startsWith(github.event.comment.body, '/agent ')))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: LeaveTheCapital/agent-workflows/.github/workflows/issue-to-pr.yml@main
    secrets:
      OPEN_API_KEY_SECRET: ${{ secrets.OPEN_API_KEY_SECRET }}
