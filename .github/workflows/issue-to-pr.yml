name: Agent issue to pull request

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_call:
    secrets:
      OPEN_API_KEY_SECRET:
        description: OpenAI API key used by the current Codex implementation
        required: true

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'agent-pr' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create working branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="agent/issue-${ISSUE_NUMBER}-${RUN_ID}"
          git switch -c "$branch"
          echo "AGENT_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Implement the issue with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPEN_API_KEY_SECRET }}
          sandbox: workspace-write
          model: gpt-5.6-sol
          effort: medium
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in this repository.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Read the repository instructions and relevant code before changing anything.
            Make the smallest complete change that satisfies the issue, and run the most
            relevant available checks. Do not create a branch, commit, push, or open a pull
            request; the workflow will handle those steps. Do not modify files solely to
            describe your work.

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$REPOSITORY" \
              --body "The coding agent completed the task but did not produce any file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          git push --set-upstream origin "$AGENT_BRANCH"

          gh pr create \
            --repo "$REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AGENT_BRANCH" \
            --title "${ISSUE_TITLE}" \
            --body-file - <<EOF
          Automated implementation for #${ISSUE_NUMBER}.

          Closes #${ISSUE_NUMBER}.
          EOF

  revise:
    name: Address pull request feedback
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.sender.login == github.repository_owner &&
      (github.event.comment.body == '/agent' ||
       startsWith(github.event.comment.body, '/agent '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Validate the pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_json=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          branch=$(jq -r '.head.ref' <<< "$pr_json")
          head_repository=$(jq -r '.head.repo.full_name' <<< "$pr_json")
          state=$(jq -r '.state' <<< "$pr_json")

          if [[ "$state" != "open" ]]; then
            echo "Pull request #${PR_NUMBER} is not open."
            exit 1
          fi

          if [[ "$head_repository" != "$REPOSITORY" ]]; then
            echo "Pull request #${PR_NUMBER} comes from another repository."
            exit 1
          fi

          if [[ "$branch" != agent/issue-* ]]; then
            echo "Pull request #${PR_NUMBER} does not use an agent branch."
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check out the agent branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pull_request.outputs.branch }}
          fetch-depth: 0

      - name: Address the feedback with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPEN_API_KEY_SECRET }}
          sandbox: workspace-write
          model: gpt-5.6-sol
          effort: medium
          prompt: |
            Update pull request #${{ github.event.issue.number }} in response to the
            repository owner's feedback.

            Pull request title:
            ${{ github.event.issue.title }}

            Pull request body:
            ${{ github.event.issue.body }}

            Feedback comment:
            ${{ github.event.comment.body }}

            Inspect the current branch, its diff, the repository instructions, and the
            relevant code before changing anything. Make the smallest complete change
            that addresses the feedback, and run the most relevant available checks.
            Do not create a branch, commit, push, or open a pull request; the workflow
            will handle those steps. Do not modify files solely to describe your work.

      - name: Push the update
        env:
          AGENT_BRANCH: ${{ steps.pull_request.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            gh pr comment "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --body "The coding agent completed the feedback request but did not produce any file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Address feedback on #${PR_NUMBER}"
          git push origin "HEAD:${AGENT_BRANCH}"

          commit_sha=$(git rev-parse --short HEAD)
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "Updated this pull request in commit \`${commit_sha}\`."
